<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECUMENOPOLIS — Terms of Use</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://www.ecumenopolis.net/css/main.css">

    <style>
        /* ── TERMINAL CONTAINER ─────────────────────────────────── */
        .tou {
            background: var(--col-bg);
            padding: 4rem 2rem 6rem;
        }
        .tou__container {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* ── TERMINAL WINDOW ────────────────────────────────────── */
        .terminal {
            background: rgba(1, 1, 41, 0.95);
            border: 1px solid rgba(129, 231, 212, 0.3);
            box-shadow: 0 0 40px rgba(129, 231, 212, 0.05), inset 0 0 60px rgba(1,1,41,0.5);
            position: relative;
            overflow: hidden;
        }

        /* scanline overlay */
        .terminal::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0,0,0,0.08) 3px,
                rgba(0,0,0,0.08) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* ── TERMINAL TITLEBAR ──────────────────────────────────── */
        .terminal__bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background: var(--col-surface);
            border-bottom: 1px solid rgba(129, 231, 212, 0.2);
        }
        .terminal__dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .terminal__dot--red   { background: var(--col-burn-red); box-shadow: 0 0 6px var(--col-burn-red); }
        .terminal__dot--yellow { background: var(--col-yellow); box-shadow: 0 0 6px var(--col-yellow); opacity: 0.6; }
        .terminal__dot--teal  { background: var(--col-teal); box-shadow: 0 0 6px var(--col-teal); opacity: 0.5; }
        .terminal__title {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: rgba(129, 231, 212, 0.5);
            margin-left: 0.5rem;
        }

        /* ── TERMINAL BODY ──────────────────────────────────────── */
        .terminal__body {
            padding: 2rem 2.5rem 3rem;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        /* ── TERMINAL HEADER ────────────────────────────────────── */
        .terminal__header {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(129, 231, 212, 0.15);
        }
        .terminal__prompt {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: var(--col-teal);
            opacity: 0.7;
        }
        .terminal__doc-title {
            font-family: var(--font-mono);
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--col-off-white);
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(129, 231, 212, 0.3);
        }
        .terminal__meta {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: rgba(240, 255, 244, 0.3);
        }
        .terminal__meta span {
            color: var(--col-hot-pink);
            margin: 0 0.5rem;
        }

        /* ── SECTION ────────────────────────────────────────────── */
        .tou-section {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
        .tou-section__label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: var(--col-teal);
        }
        .tou-section__title {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--col-burn-red);
        }
        .tou-section__divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, var(--col-hot-pink), transparent);
        }
        .tou-section__body {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.9;
            color: var(--col-pale-blue);
            max-width: 680px;
        }
        .tou-section__body em {
            color: var(--col-off-white);
            font-style: normal;
        }

        /* ── LIST ITEMS ─────────────────────────────────────────── */
        .tou-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding-left: 0;
        }
        .tou-list li {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            line-height: 1.7;
            color: var(--col-pale-blue);
            padding-left: 1.5rem;
            position: relative;
        }
        .tou-list li::before {
            content: '—';
            position: absolute;
            left: 0;
            color: var(--col-hot-pink);
        }

        /* ── HIGHLIGHT LINE ─────────────────────────────────────── */
        .tou-highlight {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            letter-spacing: 0.1em;
            color: var(--col-teal);
            padding: 0.6rem 1rem;
            border-left: 2px solid var(--col-teal);
            background: rgba(129, 231, 212, 0.04);
        }

        /* ── END OF DOCUMENT ────────────────────────────────────── */
        .terminal__footer {
            padding-top: 1.5rem;
            border-top: 1px solid rgba(129, 231, 212, 0.15);
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .terminal__footer-line {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: rgba(240, 255, 244, 0.25);
        }
        .terminal__footer-line--active {
            color: var(--col-teal);
            opacity: 0.7;
        }

        /* ── CURSOR BLINK ───────────────────────────────────────── */
        .terminal__cursor {
            display: inline-block;
            width: 8px;
            height: 1em;
            background: var(--col-teal);
            vertical-align: text-bottom;
            animation: blink 1.1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        /* ── RESPONSIVE ─────────────────────────────────────────── */
        @media (max-width: 640px) {
            .tou { padding: 2rem 1rem 4rem; }
            .terminal__body { padding: 1.25rem 1.25rem 2rem; }
        }
    </style>
</head>

    <!-- ═══════════════════════════════════════════ NAV JS ═══ -->
    <script>
        const hamburger = document.getElementById('nav-hamburger');
        const navLinks = document.getElementById('nav-links');
        hamburger.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('nav__links--open');
            hamburger.classList.toggle('nav__hamburger--open', isOpen);
            hamburger.setAttribute('aria-expanded', isOpen);
        });
        navLinks.querySelectorAll('.nav__link').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('nav__links--open');
                hamburger.classList.remove('nav__hamburger--open');
                hamburger.setAttribute('aria-expanded', false);
            });
        });
    </script>

    <!-- ═══════════════════════════════════════════ NAV GLITCH CSS ═══ -->
    <style>
        .glitch-wrap { position: relative; display: inline-block; }
        .glitch-img { display: block; }
        .glitch-img--r {
            position: absolute; top: 0; left: 0;
            mix-blend-mode: screen; opacity: 0;
            filter: brightness(0) saturate(100%) invert(30%) sepia(90%) saturate(700%) hue-rotate(320deg) brightness(120%);
            pointer-events: none;
        }
        .glitch-img--b {
            position: absolute; top: 0; left: 0;
            mix-blend-mode: screen; opacity: 0;
            filter: brightness(0) saturate(100%) invert(60%) sepia(80%) saturate(500%) hue-rotate(180deg) brightness(130%);
            pointer-events: none;
        }
        @keyframes nav-glitch-main {
            0%   { transform: translate(0); clip-path: none; opacity: 1; }
            10%  { transform: translate(-4px, 1px) skewX(-3deg); clip-path: polygon(0 10%, 100% 10%, 100% 40%, 0 40%); opacity: 0.85; }
            20%  { transform: translate(4px, -2px) skewX(2deg); clip-path: polygon(0 55%, 100% 55%, 100% 80%, 0 80%); }
            40%  { transform: translate(0); clip-path: none; opacity: 1; }
            100% { transform: translate(0); clip-path: none; opacity: 1; }
        }
        @keyframes nav-glitch-r {
            0%   { transform: translate(0); opacity: 0; }
            10%  { transform: translate(7px, -2px); opacity: 0.6; }
            20%  { transform: translate(-6px, 1px); opacity: 0.45; }
            40%  { transform: translate(0); opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes nav-glitch-b {
            0%   { transform: translate(0); opacity: 0; }
            10%  { transform: translate(-6px, 2px); opacity: 0.5; }
            20%  { transform: translate(5px, -1px); opacity: 0.4; }
            40%  { transform: translate(0); opacity: 0; }
            100% { opacity: 0; }
        }
        .glitch-wrap.nav-glitching .glitch-img    { animation: nav-glitch-main 0.4s steps(1) forwards; }
        .glitch-wrap.nav-glitching .glitch-img--r { animation: nav-glitch-r 0.4s steps(1) forwards; }
        .glitch-wrap.nav-glitching .glitch-img--b { animation: nav-glitch-b 0.4s steps(1) forwards; }
        #nav-glitch-full { display: inline-block; }
        #nav-glitch-icon { display: none; }
        @media (max-width: 640px) {
            #nav-glitch-full { display: none; }
            #nav-glitch-icon { display: inline-block; }
        }
    </style>

    <!-- ═══════════════════════════════════════════ NAV GLITCH JS ═══ -->
    <script>
    (function() {
        function triggerNavGlitch() {
            const navFull = document.getElementById('nav-glitch-full');
            const navIcon = document.getElementById('nav-glitch-icon');
            [navFull, navIcon].forEach(el => {
                el.classList.add('nav-glitching');
                setTimeout(() => el.classList.remove('nav-glitching'), 420);
            });
            const next = 2000 + Math.random() * 8000;
            setTimeout(triggerNavGlitch, next);
        }
        setTimeout(triggerNavGlitch, 2000 + Math.random() * 8000);
    })();
    </script>

    <!-- ═══════════════════════════════════════════ TERMINAL BG JS ═══ -->
    <script>
    (function() {
        const canvas = document.getElementById('terminal-canvas');
        const header = canvas.parentElement;
        const ctx = canvas.getContext('2d');
        const COLOR = '#1b244d';
        const FONT_SIZE = 11;
        const LINE_HEIGHT = 16;
        const FONT = `${FONT_SIZE}px "Roboto Mono", monospace`;

        const LINES = [
            '> INIT system_boot.sh --verbose',
            '  [OK] mounting /dev/ecumen0',
            '  [OK] loading kernel modules',
            '  [OK] network interface eth0 up',
            '> SCAN node_registry --depth=all',
            '  found 8192 registered nodes',
            '  active: 4471  |  dormant: 3721',
            '> QUERY population_index --sector=deep',
            '  sector_01 ... 2,847,331 entities',
            '  sector_02 ... 1,994,002 entities',
            '  sector_03 ... 3,112,887 entities',
            '  WARNING: sector_04 data incomplete',
            '> LOAD city_map.dat --render=false',
            '  parsing level 0001 ... done',
            '  parsing level 0512 ... done',
            '  parsing level 1024 ... done',
            '  parsing level 2048 ... done',
            '  parsing level 4096 ... done',
            '  parsing level 7168 ... done [SURFACE]',
            '  parsing level 8192 ... done [APEX]',
            '> RUN integrity_check --all',
            '  checking subsystem: POWER ... pass',
            '  checking subsystem: WATER ... pass',
            '  checking subsystem: ATMO  ... degraded',
            '  checking subsystem: COMMS ... pass',
            '  checking subsystem: RAIL  ... pass',
            '  WARNING: atmospheric recyclers at 61%',
            '> FETCH faction_data --format=raw',
            '  [SYNDICATE_07] status: active',
            '  [CORP_HELION]  status: active',
            '  [DEEP_CULT_3]  status: unknown',
            '  [FREE_RUNNERS] status: active',
            '  [IRON_WARD]    status: hostile',
            '> EXEC resource_audit.sh',
            '  fuel_cells ......... 84%',
            '  coolant_reserve .... 71%',
            '  data_storage ....... 99%',
            '  power_grid ......... 92%',
            '> PING surface_relay --timeout=30',
            '  relay_01 ... response 14ms',
            '  relay_02 ... response 22ms',
            '  relay_03 ... no response',
            '  relay_04 ... response 8ms',
            '> LOG system_events --last=100',
            '  [2291.03.14 04:12] node_7741 offline',
            '  [2291.03.14 04:18] rerouting traffic',
            '  [2291.03.14 05:01] node_7741 restored',
            '  [2291.03.14 06:33] sector_04 alert',
            '  [2291.03.14 07:44] alert cleared',
            '> COMPILE build_manifest.dat',
            '  reading source files ...',
            '  linking dependencies ...',
            '  optimizing output .....',
            '  build complete: 0 errors, 2 warnings',
            '> STATUS all --brief',
            '  city_core .......... ONLINE',
            '  deep_transit ....... ONLINE',
            '  surface_access ..... RESTRICTED',
            '  emergency_systems .. STANDBY',
            '> _',
        ];

        function resize() {
            canvas.width = header.offsetWidth;
            canvas.height = header.offsetHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let schedule = [];
        let totalMs = 0;
        const CHAR_DELAY = 18;
        const LINE_PAUSE = 120;

        LINES.forEach(line => {
            for (let i = 0; i < line.length; i++) {
                schedule.push({ time: totalMs, lineText: line, charIndex: i });
                totalMs += CHAR_DELAY;
            }
            totalMs += LINE_PAUSE;
        });

        const LOOP_DURATION = totalMs;
        const start = performance.now();

        function draw(now) {
            const W = canvas.width;
            const H = canvas.height;
            ctx.clearRect(0, 0, W, H);

            const elapsed = (now - start) % LOOP_DURATION;

            ctx.font = FONT;
            ctx.fillStyle = COLOR;

            const lineTexts = {};
            for (const entry of schedule) {
                if (entry.time > elapsed) break;
                lineTexts[entry.lineText] = entry.lineText.substring(0, entry.charIndex + 1);
            }

            const lines = Object.values(lineTexts).reverse();
            const paddingX = 24;
            const paddingBottom = 16;
            let y = H - paddingBottom;

            for (let i = 0; i < lines.length; i++) {
                if (y < 0) break;
                ctx.fillText(lines[i], paddingX, y);
                y -= LINE_HEIGHT;
            }

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    })();
    </script>

            top: 0; left: 0;

            mix-blend-mode: screen;
            opacity: 0;
            pointer-events: none;

        .devlog-glitch-wrap::after {
            content: attr(data-text);
            position: absolute;

            mix-blend-mode: screen;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes dg-main-p1 {
            0%   { transform: translate(0); clip-path: none; opacity: 1; }

            60%  { transform: translate(-3px, 2px); clip-path: polygon(0 40%, 100% 40%, 100% 60%, 0 60%); opacity: 0.8; }

            100% { transform: translate(0); clip-path: none; opacity: 1; }
        }

            0%   { transform: translate(0); opacity: 0; }
            10%  { transform: translate(10px, -3px); opacity: 0.7; }

            50%  { transform: translate(0); opacity: 0; }
            60%  { transform: translate(9px, 2px); opacity: 0.55; }

        @keyframes dg-b-p1 {

            30%  { transform: translate(-6px, 1px); opacity: 0.55; }
            50%  { transform: translate(0); opacity: 0; }
            60%  { transform: translate(-8px, -2px); opacity: 0.5; }
            80%  { transform: translate(0); opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes dg-main-p2 {
            0%   { transform: translate(0) skewX(0); clip-path: none; opacity: 1; }
            8%   { transform: translate(-12px, 0) skewX(-12deg); clip-path: polygon(0 0%, 100% 0%, 100% 30%, 0 30%); opacity: 0.7; }
            16%  { transform: translate(14px, 0) skewX(10deg); clip-path: polygon(0 30%, 100% 30%, 100% 65%, 0 65%); opacity: 0.8; }
            24%  { transform: translate(-10px, 0) skewX(-8deg); clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); opacity: 0.75; }
            35%  { transform: translate(8px, 0) skewX(6deg); clip-path: polygon(0 20%, 100% 20%, 100% 50%, 0 50%); opacity: 0.85; }
            50%  { transform: translate(-5px, 0) skewX(-4deg); clip-path: polygon(0 50%, 100% 50%, 100% 80%, 0 80%); }
            65%  { transform: translate(4px, 0) skewX(3deg); clip-path: polygon(0 10%, 100% 10%, 100% 35%, 0 35%); opacity: 0.9; }
            80%  { transform: translate(-2px, 0) skewX(-1deg); clip-path: none; opacity: 0.95; }
            100% { transform: translate(0) skewX(0); clip-path: none; opacity: 1; }
        }
        @keyframes dg-r-p2 {
            0%   { opacity: 0; transform: translate(0); }
            8%   { transform: translate(18px, -2px) skewX(-10deg); opacity: 0.8; }
            24%  { transform: translate(-14px, 1px) skewX(8deg); opacity: 0.65; }
            50%  { transform: translate(12px, 0) skewX(-6deg); opacity: 0.7; }
            80%  { transform: translate(0); opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes dg-b-p2 {
            0%   { opacity: 0; transform: translate(0); }
            8%   { transform: translate(-16px, 2px) skewX(10deg); opacity: 0.7; }
            24%  { transform: translate(12px, -1px) skewX(-8deg); opacity: 0.6; }
            50%  { transform: translate(-10px, 0) skewX(5deg); opacity: 0.65; }
            80%  { transform: translate(0); opacity: 0; }
            100% { opacity: 0; }
        }
        .devlog-glitch-wrap.glitching-p1          { animation: dg-main-p1 0.45s steps(1) forwards; }
        .devlog-glitch-wrap.glitching-p1::before  { animation: dg-r-p1 0.45s steps(1) forwards; }
        .devlog-glitch-wrap.glitching-p1::after   { animation: dg-b-p1 0.45s steps(1) forwards; }
        .devlog-glitch-wrap.glitching-p2          { animation: dg-main-p2 0.5s steps(1) forwards; }
        .devlog-glitch-wrap.glitching-p2::before  { animation: dg-r-p2 0.5s steps(1) forwards; }
        .devlog-glitch-wrap.glitching-p2::after   { animation: dg-b-p2 0.5s steps(1) forwards; }
    </style>

    <!-- ═══════════════════════════════════════════ 404 GLITCH JS ═══ -->
    <script>
        (function() {
            const wrap = document.getElementById('fourofour-title');
            let glitchCount = 0;
            function triggerGlitch() {
                glitchCount++;
                const doShear = (glitchCount % 3 === 0);
                wrap.classList.add('glitching-p1');
                setTimeout(() => {
                    wrap.classList.remove('glitching-p1');
                    if (doShear) {
                        setTimeout(() => {
                            wrap.classList.add('glitching-p2');
                            setTimeout(() => wrap.classList.remove('glitching-p2'), 550);
                        }, 200);
                    }
                }, 450);
                const next = 4000 + Math.random() * 6000;
                setTimeout(triggerGlitch, next);
            }
            setTimeout(triggerGlitch, 4000 + Math.random() * 6000);
        })();
    </script>
